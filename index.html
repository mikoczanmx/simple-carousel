<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>Simple Carousel Component</h1>
    <div class="carousel">
      <div class="content">
        <button class="prev">&lt;</button>
        <div class="slides">
          <img
            src="https://picsum.photos/id/237/750/450"
            alt="e"
            class="slide"
          />
          <img
            src="https://picsum.photos/id/238/750/450"
            alt="e"
            class="slide"
          />
          <img
            src="https://picsum.photos/id/230/750/450"
            alt="e"
            class="slide"
          />
          <img
            src="https://picsum.photos/id/240/750/450"
            alt="e"
            class="slide"
          />
        </div>
        <button class="next">&gt;</button>
      </div>
      <div class="dots">
        <button class="dot">&#9679;</button>
        <button class="dot">&#9679;</button>
        <button class="dot">&#9679;</button>
        <button class="dot">&#9679;</button>
      </div>
    </div>
  </body>
</html>
